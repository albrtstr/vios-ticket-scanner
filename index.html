
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>ViOS Christmas Carol - Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      background: #f2f5f3;
      color: #202820;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0 0 8px;
      color: #176b45;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #637067;
      font-size: 14px;
    }

    .card {
      padding: 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0000000c;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5ce;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #176b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    button.secondary {
      background: #e7eee9;
      color: #176b45;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
    }

    #result {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
    }

    #result.show {
      display: block;
      background: #edf3ef;
    }

    .hint {
      margin-top: 14px;
      color: #637067;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>ViOS Christmas Carol</h1>
      <p>Bring The Joy · Ticket Check-in</p>
    </header>

    <section class="card">
      <form id="staffForm" onsubmit="return false;">
        <label for="staffName">Nama petugas</label>
        <input
          id="staffName"
          type="text"
          placeholder="Masukkan nama petugas"
          autocomplete="name"
          required
        >

        <label for="pin">PIN petugas</label>
        <input
          id="pin"
          type="password"
          placeholder="Masukkan PIN"
          autocomplete="off"
          required
        >

        <button id="startBtn" type="button" onclick="startScanner()">
          Aktifkan Kamera
        </button>

        <button
          id="stopBtn"
          class="secondary"
          type="button"
          onclick="stopScanner()"
          disabled
        >
          Matikan Kamera
        </button>
      </form>

      <div id="reader"></div>

      <div id="result" role="status" aria-live="polite"></div>

      <p class="hint">
        Isi nama dan PIN petugas sebelum memindai QR.
        Pastikan izin kamera browser sudah diberikan.
      </p>
    </section>
  </main>

  <script>
    // URL deployment Web App Apps Script yang aktif.
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxzH-YxpxKVy9dhGAJRUbbSWvP1hWTNDzF3zIMtpdEliyQMLMcXQqhbDMu_ijeB35xF2A/exec';

    let scanner = null;
    let running = false;
    let processing = false;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resultBox = document.getElementById('result');

    function showMessage(message) {
      resultBox.textContent = message;
      resultBox.className = 'show';
    }

    function hideMessage() {
      resultBox.textContent = '';
      resultBox.className = '';
    }

    function getTicketToken(qrText) {
      const value = String(qrText || '').trim();

      // QR berisi URL e-ticket.
      try {
        const url = new URL(value);

        const token =
          url.searchParams.get('code') ||
          url.searchParams.get('token');

        if (token) return token.trim();
      } catch (error) {
        // QR mungkin berisi token langsung.
      }

      // QR berisi token langsung.
      return value;
    }

    async function startScanner() {
      if (running || processing) return;

      const staffName =
        document.getElementById('staffName').value.trim();
      const pin =
        document.getElementById('pin').value;

      if (!staffName || !pin) {
        showMessage('Isi nama petugas dan PIN terlebih dahulu.');
        return;
      }

      if (!window.Html5Qrcode) {
        showMessage(
          'Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.'
        );
        return;
      }

      hideMessage();
      startBtn.disabled = true;

      try {
        // Meminta izin kamera ketika tombol ditekan.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 },
            aspectRatio: 1
          },
          onQrScanned,
          function () {
            // Callback ini dipanggil saat frame belum berisi QR.
          }
        );

        running = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;

        showMessage('Kamera aktif. Arahkan QR tiket ke kotak scanner.');
      } catch (error) {
        running = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;

        showMessage(
          'Kamera gagal dibuka: ' +
          (error && error.message ? error.message : String(error))
        );
      }
    }

    async function stopScanner() {
      const currentScanner = scanner;

      running = false;
      scanner = null;

      if (currentScanner) {
        try {
          if (currentScanner.isScanning) {
            await currentScanner.stop();
          }

          await currentScanner.clear();
        } catch (error) {
          console.warn('Gagal menghentikan scanner:', error);
        }
      }

      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    async function onQrScanned(decodedText) {
      if (!running || processing) return;

      // Kunci agar callback tidak mengirim tiket berulang kali.
      processing = true;

      const staffName =
        document.getElementById('staffName').value.trim();
      const pin =
        document.getElementById('pin').value;
      const token = getTicketToken(decodedText);

      if (!token || !staffName || !pin) {
        processing = false;
        showMessage('Kode tiket, nama petugas, atau PIN tidak tersedia.');
        return;
      }

      await stopScanner();

      showMessage('QR terbaca. Mengirim permintaan check-in...');

      try {
        // POST melalui form, tanpa menaruh PIN di URL.
        // Hasil dari Apps Script akan terbuka di tab yang sama.
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APPS_SCRIPT_URL;
        form.target = '_self';

        const fields = {
          token: token,
          pin: pin,
          staffName: staffName
        };

        Object.keys(fields).forEach(function (key) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = fields[key];
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
      } catch (error) {
        processing = false;
        showMessage(
          'Gagal mengirim permintaan: ' +
          (error && error.message ? error.message : String(error))
        );
        startBtn.disabled = false;
      }
    }

    window.addEventListener('pagehide', function () {
      if (scanner && scanner.isScanning) {
        scanner.stop().catch(function () {});
      }
    });
  </script>
</body>
</html>
