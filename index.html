<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>ViOS Christmas Carol - Check-in</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 14px; font-family: Arial, sans-serif; background: #f2f5f3; color: #202820; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { text-align: center; padding: 18px 10px; }
    .header h1 { margin: 0 0 8px; color: #176b45; font-size: 25px; }
    .header p { margin: 0; color: #637067; font-size: 14px; }
    .card { padding: 20px; background: #fff; border-radius: 16px; box-shadow: 0 4px 18px #0000000c; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: bold; }
    input { width: 100%; padding: 13px; border: 1px solid #cbd5ce; border-radius: 9px; font-size: 16px; background: white; }
    button { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 9px; background: #176b45; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary { background: #e7eee9; color: #176b45; }
    button.danger { background: #9b2c2c; }
    #reader { width: 100%; margin-top: 18px; overflow: hidden; }
    #result { display: none; margin-top: 16px; padding: 14px; border-radius: 10px; overflow-wrap: anywhere; line-height: 1.5; font-size: 14px; white-space: pre-line; }
    #result.show { display: block; background: #edf3ef; }
    #result.error { background: #fff0f0; color: #8a1c1c; }
    #result.success { background: #e8f7ec; color: #176b45; }
    .hint { margin-top: 14px; color: #637067; font-size: 12px; line-height: 1.5; }
    .session { display:none; margin: 0 0 10px; padding: 10px 12px; background: #edf3ef; border-radius: 9px; font-size: 13px; }
    .hidden { display:none !important; }
    #bridgeFrame { display:none; width:0; height:0; border:0; }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>ViOS Christmas Carol</h1>
      <p>Bring The Joy · Ticket Check-in</p>
    </header>
    <section class="card">
      <div id="sessionInfo" class="session"></div>
      <form id="loginForm" onsubmit="return false;">
        <label for="staffName">Nama petugas</label>
        <input id="staffName" type="text" placeholder="Masukkan nama petugas" autocomplete="name" required>
        <label for="pin">PIN petugas</label>
        <input id="pin" type="password" placeholder="Masukkan PIN" autocomplete="off" required>
        <button id="loginBtn" type="button">Login Petugas</button>
      </form>
      <div id="scannerControls" class="hidden">
        <button id="startBtn" type="button">Aktifkan Kamera</button>
        <button id="stopBtn" class="secondary" type="button" disabled>Matikan Kamera</button>
        <button id="logoutBtn" class="danger" type="button">Logout</button>
      </div>
      <div id="reader"></div>
      <div id="result" role="status" aria-live="polite"></div>
      <p class="hint">Login memerlukan koneksi internet. Sesi berlaku maksimal 8 jam dan divalidasi oleh server. Berikan izin kamera pada browser saat diminta.</p>
    </section>
  </main>
  <iframe id="bridgeFrame" name="bridgeFrame" title="Koneksi aman ke server"></iframe>
  <script>
    // Ganti dengan URL deployment Web App Apps Script yang aktif.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzH-YxpxKVy9dhGAJRUbbSWvP1hWTNDzF3zIMtpdEliyQMLMcXQqhbDMu_ijeB35xF2A/exec';
    const SESSION_STORAGE_KEY = 'viosScannerSessionV1';
    const BRIDGE_SOURCE = 'VIOS_SCANNER_BRIDGE';

    let scanner = null;
    let running = false;
    let processing = false;
    let pendingRequestId = null;
    let pendingAction = null;
    let pendingTimeout = null;

    const loginForm = document.getElementById('loginForm');
    const scannerControls = document.getElementById('scannerControls');
    const loginBtn = document.getElementById('loginBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const resultBox = document.getElementById('result');
    const sessionInfo = document.getElementById('sessionInfo');
    const bridgeFrame = document.getElementById('bridgeFrame');

    function showMessage(message, type) {
      resultBox.textContent = message || '';
      resultBox.className = 'show' + (type ? ' ' + type : '');
    }
    function hideMessage() { resultBox.textContent = ''; resultBox.className = ''; }
    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_STORAGE_KEY);
        if (!raw) return null;
        const value = JSON.parse(raw);
        if (!value || !value.sessionToken || !value.expiresAt || Date.now() >= Number(value.expiresAt)) {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          return null;
        }
        return value;
      } catch (e) { localStorage.removeItem(SESSION_STORAGE_KEY); return null; }
    }
    function saveSession(result) {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
        sessionToken: result.sessionToken,
        staffName: result.staffName,
        expiresAt: Number(result.expiresAt)
      }));
    }
    function showLoggedIn(session) {
      loginForm.classList.add('hidden');
      scannerControls.classList.remove('hidden');
      sessionInfo.style.display = 'block';
      sessionInfo.textContent = 'Login: ' + session.staffName + ' · Sesi berakhir ' + new Date(Number(session.expiresAt)).toLocaleString('id-ID');
    }
    function showLoggedOut() {
      loginForm.classList.remove('hidden');
      scannerControls.classList.add('hidden');
      sessionInfo.style.display = 'none';
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
    function makeRequestId() {
      return 'req_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 12);
    }
    function sendBridgeRequest(action, fields) {
      return new Promise((resolve, reject) => {
        if (pendingRequestId) { reject(new Error('Permintaan sebelumnya masih diproses.')); return; }
        const requestId = makeRequestId();
        pendingRequestId = requestId;
        pendingAction = action;
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APPS_SCRIPT_URL;
        form.target = 'bridgeFrame';
        form.style.display = 'none';
        const payload = Object.assign({}, fields || {}, {
          action: action,
          requestId: requestId,
          parentOrigin: window.location.origin
        });
        Object.keys(payload).forEach(key => {
          const input = document.createElement('input');
          input.type = 'hidden'; input.name = key; input.value = String(payload[key] == null ? '' : payload[key]);
          form.appendChild(input);
        });
        document.body.appendChild(form);
        pendingTimeout = window.setTimeout(() => {
          if (pendingRequestId === requestId) {
            pendingRequestId = null; pendingAction = null; pendingTimeout = null;
            form.remove(); reject(new Error('Server tidak merespons. Periksa URL deployment, izin akses Web App, dan SCANNER_ALLOWED_ORIGINS.'));
          }
        }, 25000);
        try { form.submit(); } catch (error) {
          clearTimeout(pendingTimeout); pendingTimeout = null; pendingRequestId = null; pendingAction = null;
          form.remove(); reject(error);
        }
        window.setTimeout(() => form.remove(), 3000);
        // resolve/reject dilakukan oleh message listener di bawah.
        window.__viosPendingResolve = resolve;
        window.__viosPendingReject = reject;
      });
    }

    
window.addEventListener('message', function(event) {
  console.log('[VIOS Bridge] Message received', {
    origin: event.origin,
    source: event.data && event.data.source,
    requestId: event.data && event.data.requestId,
    pendingRequestId: pendingRequestId,
    data: event.data
  });

  let senderHost = '';
  try {
    senderHost = new URL(event.origin).hostname;
  } catch (e) {
    console.warn('[VIOS Bridge] Invalid origin:', event.origin);
    return;
  }

  const isGoogleAppsScriptOrigin =
    senderHost === 'script.google.com' ||
    senderHost === 'script.googleusercontent.com' ||
    senderHost.endsWith('.script.googleusercontent.com');

  if (!isGoogleAppsScriptOrigin) {
    console.warn('[VIOS Bridge] Origin rejected:', event.origin);
    return;
  }

  const data = event.data;

  if (!data || data.source !== BRIDGE_SOURCE) {
    console.warn('[VIOS Bridge] Invalid message source:', data);
    return;
  }

  if (data.requestId !== pendingRequestId) {
    console.warn('[VIOS Bridge] Request ID mismatch:', {
      received: data.requestId,
      expected: pendingRequestId
    });
    return;
  }

  if (pendingTimeout) clearTimeout(pendingTimeout);

  pendingTimeout = null;
  pendingRequestId = null;
  pendingAction = null;

  const resolve = window.__viosPendingResolve;
  const reject = window.__viosPendingReject;

  window.__viosPendingResolve = null;
  window.__viosPendingReject = null;

  if (resolve) {
    console.log('[VIOS Bridge] Resolving request:', data.result);
    resolve(data.result || {
      ok: false,
      message: 'Respons server kosong.'
    });
  } else if (reject) {
    reject(new Error('Respons server tidak dapat diproses.'));
  }
});


    async function login() {
      const staffName = document.getElementById('staffName').value.trim();
      const pin = document.getElementById('pin').value;
      if (!staffName || !pin) { showMessage('Masukkan nama petugas dan PIN.', 'error'); return; }
      loginBtn.disabled = true;
      showMessage('Memeriksa PIN dan membuat sesi...', '');
      try {
        const result = await sendBridgeRequest('login', { staffName, pin });
        if (!result.ok) { showMessage(result.message || 'Login gagal.', 'error'); return; }
        saveSession(result);
        document.getElementById('pin').value = '';
        showLoggedIn(getSession());
        showMessage(result.message || 'Login berhasil. Sesi berlaku 8 jam.', 'success');
      } catch (error) { showMessage(error.message || 'Login gagal menghubungi server.', 'error'); }
      finally { loginBtn.disabled = false; }
    }

    async function validateSession() {
      const session = getSession();
      if (!session) { showLoggedOut(); return false; }
      try {
        const result = await sendBridgeRequest('validate', { sessionToken: session.sessionToken });
        if (!result.ok) {
          localStorage.removeItem(SESSION_STORAGE_KEY); showLoggedOut();
          showMessage(result.message || 'Sesi tidak valid. Silakan login kembali.', 'error');
          return false;
        }
        const updated = Object.assign({}, session, { staffName: result.staffName || session.staffName, expiresAt: Number(result.expiresAt) || session.expiresAt });
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(updated));
        showLoggedIn(updated); hideMessage(); return true;
      } catch (error) {
        showLoggedOut(); showMessage('Tidak dapat memvalidasi sesi ke server: ' + error.message, 'error'); return false;
      }
    }

    async function logout() {
      const session = getSession();
      await stopScanner();
      if (session) {
        try { await sendBridgeRequest('logout', { sessionToken: session.sessionToken }); }
        catch (error) { console.warn('Logout server gagal:', error); }
      }
      localStorage.removeItem(SESSION_STORAGE_KEY);
      showLoggedOut();
      showMessage('Kamu sudah logout dari scanner.', 'success');
    }

    async function startScanner() {
      if (running || processing) return;
      const valid = await validateSession();
      if (!valid) return;
      if (!window.Html5Qrcode) { showMessage('Library scanner gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'error'); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showMessage('Browser tidak mendukung akses kamera atau halaman tidak menggunakan HTTPS.', 'error'); return; }
      hideMessage(); startBtn.disabled = true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        stream.getTracks().forEach(track => track.stop());
        scanner = new Html5Qrcode('reader');
        await scanner.start({ facingMode: 'environment' }, {
          fps: 10,
          qrbox: function(width, height) { const size = Math.floor(Math.min(width, height) * 0.8); return { width: size, height: size }; },
          aspectRatio: 1
        }, function(decodedText) { onQrScanned(decodedText); }, function() {});
        running = true; startBtn.disabled = true; stopBtn.disabled = false;
        showMessage('Kamera aktif. Arahkan QR tiket ke kotak scanner.');
      } catch (error) {
        running = false; startBtn.disabled = false; stopBtn.disabled = true;
        showMessage('Kamera gagal dibuka: ' + (error && error.message ? error.message : String(error)), 'error');
      }
    }

    async function stopScanner() {
      const currentScanner = scanner;
      running = false; scanner = null;
      if (currentScanner) {
        try { if (currentScanner.isScanning) await currentScanner.stop(); await currentScanner.clear(); }
        catch (error) { console.warn('Gagal menghentikan scanner:', error); }
      }
      startBtn.disabled = false; stopBtn.disabled = true;
    }

    function getTicketToken(qrText) {
      const value = String(qrText || '').trim();
      try {
        const url = new URL(value);
        const token = url.searchParams.get('code') || url.searchParams.get('token');
        if (token) return token.trim();
      } catch (error) { /* QR dapat berisi token langsung. */ }
      return value;
    }

    async function onQrScanned(decodedText) {
      if (!running || processing) return;
      processing = true;
      const session = getSession();
      const token = getTicketToken(decodedText);
      if (!token || !session) {
        processing = false;
        showMessage('Kode tiket tidak terbaca atau sesi sudah berakhir. Login kembali jika diperlukan.', 'error');
        await stopScanner(); return;
      }
      await stopScanner();
      showMessage('QR terbaca. Memvalidasi tiket...', '');
      try {
        const result = await sendBridgeRequest('checkin', { token, sessionToken: session.sessionToken });
        if (result.sessionExpired) {
          localStorage.removeItem(SESSION_STORAGE_KEY); showLoggedOut();
        }
        const lines = [result.message || (result.ok ? 'CHECK-IN BERHASIL' : 'CHECK-IN GAGAL')];
        if (result.name) lines.push('Nama: ' + result.name);
        if (result.orderId) lines.push('Order ID: ' + result.orderId);
        if (result.checkedInBy) lines.push('Petugas: ' + result.checkedInBy);
        if (result.checkInTime) lines.push('Waktu: ' + new Date(result.checkInTime).toLocaleString('id-ID'));
        showMessage(lines.join('\n'), result.ok ? 'success' : 'error');
      } catch (error) {
        showMessage('Gagal menghubungi server: ' + (error.message || String(error)), 'error');
      } finally { processing = false; }
    }

    loginBtn.addEventListener('click', login);
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    logoutBtn.addEventListener('click', logout);
    window.addEventListener('pagehide', function() {
      if (scanner && scanner.isScanning) scanner.stop().catch(function() {});
    });

    // Saat halaman dibuka ulang, token lokal tidak langsung dipercaya: server tetap memvalidasinya.
    (async function init() {
      const session = getSession();
      if (session) await validateSession();
      else showLoggedOut();
    })();
  </script>
</body>
</html>
