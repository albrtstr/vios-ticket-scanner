
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViOS Christmas Carol - Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
      background: #f7f7f7;
      color: #222;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-size: 16px;
    }
    #result {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
    
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

  </style>
</head>
<body>
  <div class="panel">
    <h2>ViOS Christmas Carol</h2>
    <p>Ticket Check-in Scanner</p>
    
    <label for="staffName">Nama petugas</label>
    <input id="staffName" autocomplete="name"
      placeholder="Nama petugas" required>
    
    <label for="pin">PIN petugas</label>
    <input id="pin" type="password"
      inputmode="numeric" autocomplete="off"
      placeholder="Masukkan PIN" required>

    <div id="reader"></div>
    <button id="startBtn" onclick="startScanner()">
      Aktifkan Kamera
    </button>
    <button onclick="stopScanner()">Matikan Kamera</button>
    <div id="result" role="status">
      Kamera belum diaktifkan.
    </div>
  </div>

  <script>
    let scanner = null;
    let running = false;

    async function startScanner() {
      const result = document.getElementById("result");

      if (running) return;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Browser tidak menyediakan akses kamera. Pastikan halaman menggunakan HTTPS."
          );
        }

        // Uji izin kamera terlebih dahulu.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        stream.getTracks().forEach(track => track.stop());

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          decodedText => onQRScanned(decodedText),
          () => {}
        );

        running = true;
        result.textContent = "Kamera aktif. Arahkan ke QR tiket.";
      } catch (error) {
        result.textContent =
          "Kamera gagal dibuka: " + error.message;
      }
    }

    async function stopScanner() {
      if (scanner && running) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.error(error);
        }
      }

      running = false;
      scanner = null;
    }

    
async function onQrScanned(decodedText) {
  if (running === false) return;

  await stopScanner();

  const staffName =
    document.getElementById('staffName').value.trim();
  const pin =
    document.getElementById('pin').value;

  if (!staffName || !pin) {
    document.getElementById('result').textContent =
      'Isi nama petugas dan PIN sebelum scan.';
    return;
  }

  let token = decodedText.trim();

  // QR bisa berisi URL e-ticket atau token langsung.
  try {
    const qrUrl = new URL(decodedText);
    const code = qrUrl.searchParams.get('code');

    if (code) token = code;
  } catch (_) {
    // Bukan URL; gunakan isi QR sebagai token.
  }

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = APPS_SCRIPT_URL;
  form.target = '_blank';

  const fields = { token, pin, staffName };

  Object.entries(fields).forEach(([name, value]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value;
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  form.remove();

  document.getElementById('result').textContent =
    'Permintaan dikirim. Periksa tab hasil check-in.';
}

    
const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxzH-YxpxKVy9dhGAJRUbbSWvP1hWTNDzF3zIMtpdEliyQMLMcXQqhbDMu_ijeB35xF2A/exec';

  </script>
</body>
</html>
